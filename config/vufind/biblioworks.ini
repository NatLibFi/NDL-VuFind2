; BiblioworksHelpdesk Configuration (template)
; This file configures the Biblioworks Helpdesk integration for VuFind/Finna.
; Copy this file to local/config/finna/biblioworks.ini and fill in real values.
; The integration is disabled unless enabled=true.

[BiblioworksHelpdesk]
; Enable/disable the integration
enabled = false

; UST (User Session Token) encryption key
; SECURITY: This must match the key used by the adapter for decryption
; Generate with: Defuse\Crypto\Key::createNewRandomKey()
; ust_encryption_key = "def00000..."

; UST time-to-live in seconds (default 172800 = 2 days)
; ust_ttl_seconds = 172800

; UST audience claim (default: biblioworks-adapter)
; ust_audience = "biblioworks-adapter"

; UST issuer claim (example: kyyti.finna.fi)
; ust_issuer = "example.finna.fi"

; Mock mode skips ILS session validation and builds a patron from user.cat_id
; (falling back to the VuFind internal user ID). Also used in tests.
; allow_mock_patron = false

[Security]
; Rate limiting is handled by VuFind's existing rate limiter

[Logging]
; Errors are logged automatically; patron IDs are NOT logged for privacy

[Chatbot]
; Enable/disable the chatbot widget on the website
chatbot_enabled = false

; Chatbot API token. This is not a secret.
; chatbot_token = "YOUR_CHATBOT_TOKEN"

; Chatbot base URL
; chatbot_base_url = "https://helpdesk.example.org"

[CSP]
; The chatbot widget requires CSP (Content Security Policy) allowlisting.
; Edit local/config/finna/contentsecuritypolicy.ini and add to the [Directives] section:
;
;   ; BiblioWorks Helpdesk Chatbot
;   script-src[] = "https://helpdesk.example.org"
;   frame-src[] = "https://helpdesk.example.org"
;   connect-src[] = "https://helpdesk.example.org"
;
; Replace the URL with your chatbot_base_url value.
; The inline <script> tag is already covered by CSP nonce.
